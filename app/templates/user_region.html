{% extends "base.html" %}
{% block title %}지역별 운동 시설·강좌 - {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="container">
  <div class="page-head"><div><h1>지역별 운동 시설·강좌 <button class="help-button" type="button" data-help-title="지역 현황 안내" data-help="시군구를 선택하면 스포츠 강좌이용권 시설과 최근 강좌, 종목별·시간대별 운영 현황을 볼 수 있습니다. 표시된 이용 이력은 현재 모집 여부를 뜻하지 않습니다." aria-label="지역 현황 안내">?</button></h1><p class="sub">선택한 지역의 스포츠 강좌이용권 시설과 최근 강좌 현황을 확인할 수 있습니다.</p></div>{% include "partials/user_region_picker.html" %}</div>
  <div id="ur-body"><div class="notice">시군구를 선택해 주세요.</div></div>
</div>
{% endblock %}
{% block extra_scripts %}
<script nonce="{{ request.state.csp_nonce }}">
(function () {
  const body = document.getElementById("ur-body");
  const DOWS = ["월", "화", "수", "목", "금", "토", "일"];
  function bars(pairs, labelFn) { const max = Math.max(1, ...pairs.map((p) => p[1])); return `<div class="bar-list">${pairs.map(([k, v]) => `<div class="bar-row"><span class="k">${esc(labelFn ? labelFn(k) : k)}</span><div class="bar"><span style="width:${(v / max * 100).toFixed(1)}%"></span></div><span class="v">${fmtNum(v)}</span></div>`).join("")}</div>`; }
  async function load(code) {
    if (!code) return;
    body.innerHTML = '<div class="empty-state"><span class="spinner"></span></div>';
    try {
      const d = await api.get(`/api/user/region/${code}`); const r = d.region; const sig = d.signals || {};
      body.innerHTML = `
        <div class="card card-pad mb-16"><h2>${esc(r.sidoName)} ${esc(r.sigunguName)}</h2><ul class="stack">${d.plain.map((t) => `<li class="guide-list">• ${esc(t)}</li>`).join("")}</ul></div>
        <div class="grid-4 mb-16">
          <div class="card stat"><div class="label" data-tooltip="표시된 집계기간에 강좌 기록이 있는 가맹시설 수입니다. 전체 가맹시설 수나 현재 이용 가능한 시설 수가 아닙니다.">강좌 기록이 있는 가맹시설</div><div class="value">${fmtNum(r.activeFacilityCount)}<small>곳</small></div><div class="desc">${esc(r.activeCutoffMonth || "–")} ~ ${esc(r.dataMaxMonth || "–")}</div></div>
          <div class="card stat"><div class="label" data-tooltip="표시된 집계기간에 기록이 있는 강좌 수입니다. 현재 모집 중이거나 잔여석이 있는 강좌 수가 아닙니다.">집계기간 내 강좌</div><div class="value">${fmtNum(r.activeCourseCount)}<small>개</small></div><div class="desc">종목 ${fmtNum(r.sportCount)}가지</div></div>
          <div class="card stat"><div class="label" data-tooltip="시간표가 확인된 강좌 중 오후 6시 이후 시작 수업이 있는 강좌의 비율입니다. 주말을 포함하며 시간표 미확인 강좌는 분모에서 제외됩니다.">저녁 강좌</div><div class="value">${fmtPct(r.eveningShare)}</div><div class="desc">18시 이후 시작</div></div>
          <div class="card stat"><div class="label" data-tooltip="큰 숫자는 이 지역 희망 강좌 등록 건수이며, 시설 이용 희망은 별도 건수입니다. 실인원·실제 수강 신청이 아니며 반복 등록이 포함될 수 있습니다.">희망 강좌 등록 건수</div><div class="value">${fmtNum((sig.demand || {}).total || 0)}<small>건</small></div><div class="desc">희망 강좌 · 시설 이용 희망 ${fmtNum(sig.voteTotal || 0)}건</div></div>
        </div>
        <div class="grid-2 mb-16">
          <div class="card card-pad"><div class="card-head"><h3 data-tooltip="집계기간에 기록이 있는 강좌를 종목별로 집계한 상위 10개입니다. 인원·정원 수가 아닙니다.">종목별 강좌 수</h3></div>${d.sportCounts.length ? bars(d.sportCounts.slice(0, 10)) : '<p class="muted">집계기간에 기록된 강좌가 없습니다.</p>'}</div>
          <div class="card card-pad"><div class="card-head"><h3 data-tooltip="시간표가 연결된 강좌를 2시간 시작 시각 구간과 요일별로 집계합니다. 여러 일정이 있는 강좌는 반복 포함될 수 있습니다.">시작 시각·요일별 분포</h3></div>${bars(Object.entries(d.hourBins).map(([h, v]) => [h + "시", v]))}<div class="mt-16">${bars(DOWS.map((n, i) => [n, d.dowCounts[i]]))}</div></div>
        </div>
        <div class="card card-pad"><div class="card-head"><h3>시설 ${fmtNum(d.facilities.length)}곳</h3><a class="btn btn-sm btn-primary" href="/user/facilities?region=${esc(code)}" data-tooltip="같은 지역을 선택한 시설 검색으로 이동합니다. 시설명을 선택하면 상세 강좌와 마지막 신청 기록을 확인할 수 있습니다.">시설 자세히</a></div>
          <div class="tile-grid">${d.facilities.slice(0, 24).map((f) => `<div class="tile"><div class="t">${esc(f.name)}</div><div class="m">${esc((f.sports || []).join(", "))}</div><div class="m">${esc(f.address || "")}</div><div class="m">${f.usage && f.usage.active ? '<span class="badge badge-ok" data-tooltip="집계기간에 강좌 기록이 있습니다. 현재 모집·영업 여부를 뜻하지 않습니다.">집계기간 내 기록 있음</span>' : (f.usage && f.usage.lastMonth ? '<span class="badge badge-muted" data-tooltip="과거 강좌 기록은 있으나 집계기간에는 기록이 없습니다. 폐업·가맹 해제를 뜻하지 않습니다.">집계기간 내 기록 없음</span>' : '<span class="badge badge-muted" data-tooltip="시설에 연결된 강좌 이용 이력이 없어 기록 여부를 판단할 수 없습니다. 이용자 0명이나 폐업을 뜻하지 않습니다.">기록 미확인</span>')} ${f.transit ? `정류장 ${Math.round(f.transit.minWalkSec / 60)}분` : ""}</div></div>`).join("")}</div>
        </div>`;
    } catch (e) { body.innerHTML = `<div class="notice error">${esc(e.message)}</div>`; }
  }
  document.addEventListener("region-change", (e) => load(e.detail));
  if (window.currentRegion && window.currentRegion()) load(window.currentRegion());
})();
</script>
{% endblock %}
