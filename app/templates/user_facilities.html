{% extends "base.html" %}
{% block title %}스포츠 강좌이용권 사용 가능 시설 - {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="container">
  <div class="page-head"><div><h1>스포츠 강좌이용권 사용 가능 시설 <button class="help-button" type="button" data-help-title="시설 검색 안내" data-help="지역을 선택하고 종목·시간대 또는 시설명으로 검색할 수 있습니다. 시설을 선택하면 확인된 강좌와 이용 기록을 볼 수 있습니다. 최근 이용 기록이 현재 모집 중임을 의미하지는 않습니다." aria-label="시설 검색 안내">?</button></h1><p class="sub">종목·시간대·시설명으로 스포츠 강좌이용권 가맹시설과 강좌 정보를 확인합니다.</p></div>{% include "partials/user_region_picker.html" %}</div>
  <div class="card card-pad mb-16"><div class="input-row">
    <select class="input" id="f-sport" data-tooltip="시설 자료에 표시된 종목으로 시설 목록을 좁힙니다. 비우면 모든 종목을 표시합니다." style="width:auto;min-width:140px"><option value="">모든 종목</option></select>
    <input class="input" id="f-q" data-tooltip="시설 이름에 입력한 글자가 포함된 시설을 검색합니다." placeholder="시설 이름" style="min-width:160px" />
    <label class="checkbox-row" style="margin:0" data-tooltip="집계기간에 기록이 있으며 시간표상 오후 6시 이후 시작하는 수업이 있는 시설만 표시합니다. 주말도 포함하며 현재 모집 여부와는 다릅니다."><input type="checkbox" id="f-evening" data-tooltip="집계기간에 기록이 있으며 시간표상 오후 6시 이후 시작하는 수업이 있는 시설만 표시합니다. 주말도 포함하며 현재 모집 여부와는 다릅니다." /> <span>저녁 강좌 있는 곳만</span></label>
    <label class="checkbox-row" style="margin:0" data-tooltip="선택하면 집계기간 내 강좌 기록이 있는 시설만 표시합니다. 해제하면 과거 기록 또는 기록 미확인 시설도 포함됩니다. 현재 영업 상태를 판정하는 필터는 아닙니다."><input type="checkbox" id="f-active" data-tooltip="선택하면 집계기간 내 강좌 기록이 있는 시설만 표시합니다. 해제하면 과거 기록 또는 기록 미확인 시설도 포함됩니다. 현재 영업 상태를 판정하는 필터는 아닙니다." checked /> <span>집계기간 내 강좌 기록 있는 곳만</span></label>
    <button class="btn btn-primary" id="f-go" data-tooltip="지역과 현재 필터를 적용해 시설을 조회합니다. 표시된 수는 검색 결과이며 실제 모집 중인 시설 수와 다를 수 있습니다.">찾기</button>
  </div></div>
  <div id="uf-body"><div class="notice">시군구를 선택해 주세요.</div></div>
</div>
{% endblock %}
{% block extra_scripts %}
<script nonce="{{ request.state.csp_nonce }}">
(function () {
  const body = document.getElementById("uf-body");
  const SPORTS = ["태권도", "수영", "헬스", "축구(풋살)", "복싱", "필라테스", "댄스(줌바 등)", "무용(발레 등)", "줄넘기", "농구", "야구", "검도", "유도", "합기도", "요가", "주짓수", "배드민턴", "탁구", "골프", "기타종목"];
  const sel = document.getElementById("f-sport"); SPORTS.forEach((s) => { const o = document.createElement("option"); o.value = s; o.textContent = s; sel.appendChild(o); });
  async function load() {
    const code = window.currentRegion && window.currentRegion(); if (!code) { showSnackbar("시군구를 선택해 주세요.", "error"); return; }
    body.innerHTML = '<div class="empty-state"><span class="spinner"></span></div>';
    try {
      const d = await api.get("/api/user/facilities" + qs({ region: code, sport: sel.value, q: document.getElementById("f-q").value, evening: document.getElementById("f-evening").checked, active_only: document.getElementById("f-active").checked }));
      if (!d.items.length) { body.innerHTML = '<div class="empty-state">조건에 맞는 시설이 없습니다. <a href="/user/voice">희망 강좌·시설 수요 등록</a>을 이용해 의견을 남길 수 있습니다.</div>'; return; }
      body.innerHTML = `<p class="faint">${d.items.length}곳 · 강좌 기록 기준 ${esc(d.cutoff)} 이후</p><div class="tile-grid">${d.items.map((f) => `<div class="tile"><div class="t"><a href="#" data-fac="${esc(f.facilityId)}" data-tooltip="시설의 공개 연락처·강좌 목록·시간표·수강료·마지막 신청 기록을 확인합니다. 현재 모집 여부는 시설에 문의해야 합니다.">${esc(f.name)}</a></div><div class="m">${esc((f.activeSports.length ? f.activeSports : f.sports || []).join(", "))}</div><div class="m">${esc(f.address || "")}${f.tel ? " · " + esc(f.tel) : ""}</div><div class="row m">${f.activeCourses ? `<span class="chip" data-tooltip="집계기간에 기록이 있는 강좌 수입니다. 현재 모집 중인 강좌 수와 다릅니다.">강좌 ${f.activeCourses}</span>` : ""}${f.eveningCourses ? `<span class="chip" data-tooltip="시간표에 오후 6시 이후 시작 수업이 있는 강좌 수입니다. 주말도 포함합니다.">저녁 ${f.eveningCourses}</span>` : ""}${f.weekendCourses ? `<span class="chip" data-tooltip="시간표에 토요일 또는 일요일 수업이 있는 강좌 수입니다.">주말 ${f.weekendCourses}</span>` : ""}${f.minPrice != null ? `<span class="chip off" data-tooltip="집계기간 강좌의 확인된 월 수강료 중 최저값입니다. 현재 요금·본인부담금과 다를 수 있습니다.">월 ${fmtWon(f.minPrice)}부터</span>` : ""}${f.transit ? `<span class="chip off" data-tooltip="연결된 정류장 중 최소 도보 시간을 분 단위로 반올림한 값입니다. 실제 출발지에서 시설까지의 이동시간이 아닙니다.">정류장 ${Math.round(f.transit.minWalkSec / 60)}분</span>` : ""}</div></div>`).join("")}</div>`;
      body.querySelectorAll("[data-fac]").forEach((a) => a.addEventListener("click", async (e) => { e.preventDefault(); show(a.dataset.fac); }));
    } catch (e) { body.innerHTML = `<div class="notice error">${esc(e.message)}</div>`; }
  }
  async function show(id) {
    try {
      const f = await api.get(`/api/user/facility/${encodeURIComponent(id)}`);
      const html = `<div class="dialog-backdrop open" id="fac-dialog"><div class="dialog dialog-lg"><div class="dialog-header"><h2>${esc(f.name)}</h2><button class="btn-icon" data-dialog-close aria-label="시설 상세 닫기" data-tooltip="시설 상세 창을 닫고 검색 결과로 돌아갑니다.">&times;</button></div>
        <p class="small">${esc(f.address || "")} ${esc(f.detailAddress || "")}${f.tel ? " · " + esc(f.tel) : ""}${f.transit ? ` · 정류장 ${esc(f.transit.stopName)} 도보 ${Math.round(f.transit.minWalkSec / 60)}분` : ""}</p>
        <div class="table-wrap"><table class="table responsive"><thead><tr><th data-tooltip="공개 이용현황에 기록된 강좌명입니다. 현재 개설·모집 중인지 시설에 확인해야 합니다.">강좌</th><th data-tooltip="별도 공개 시간표를 연결한 요일·시각입니다. 시간 미확인은 상시 이용 가능을 뜻하지 않습니다.">시간</th><th class="num" data-tooltip="공개 자료의 지원금 차감 전 월 수강료입니다. –는 요금 미확인으로 무료가 아닙니다.">월 수강료</th><th data-tooltip="해당 강좌의 마지막 기록월과 그 월의 신청 인원입니다. 현재 모집·대기 인원이나 잔여석이 아닙니다.">마지막 집계월 신청</th></tr></thead><tbody>${f.courses.map((c) => `<tr><td class="name" data-label="강좌">${esc(c.name)}<span class="sub">${esc(c.sport)}</span></td><td data-label="시간">${esc(fmtSessions(c.sessions))}</td><td class="num" data-label="월 수강료">${fmtWon(c.priceWon)}</td><td data-label="마지막 집계월 신청">${esc(c.lastMonth)} · 신청 ${fmtNum(c.lastApplicants)}</td></tr>`).join("")}</tbody></table></div>
        <p class="faint mt-8">현재 모집 여부·잔여석은 시설에 확인하세요. 신청·결제는 <a href="https://svoucher.kspo.or.kr/main.do" target="_blank" rel="noopener">공식 사이트</a>에서 합니다.</p></div></div>`;
      const old = document.getElementById("fac-dialog"); if (old) old.remove(); document.body.insertAdjacentHTML("beforeend", html);
    } catch (e) { showSnackbar(e.message, "error"); }
  }
  document.getElementById("f-go").addEventListener("click", load);
  document.addEventListener("region-change", load);
  if (window.currentRegion && window.currentRegion()) load();
})();
</script>
{% endblock %}
