{% extends "base.html" %}
{% block title %}시설 찾기 - {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="container">
  <div class="page-head"><div><h1>이용권 시설</h1><p class="sub">이용권으로 결제할 수 있는 시설을 종목·시간·이름으로 찾습니다. 시설을 누르면 강좌 목록이 뜹니다.</p></div>{% include "partials/user_region_picker.html" %}</div>
  <div class="card card-pad mb-16"><div class="input-row">
    <select class="input" id="f-sport" style="width:auto;min-width:140px"><option value="">모든 종목</option></select>
    <input class="input" id="f-q" placeholder="시설 이름" style="min-width:160px" />
    <label class="checkbox-row" style="margin:0"><input type="checkbox" id="f-evening" /> <span>저녁 강좌 있는 곳만</span></label>
    <label class="checkbox-row" style="margin:0"><input type="checkbox" id="f-active" checked /> <span>최근 1년 운영 중만</span></label>
    <button class="btn btn-primary" id="f-go">찾기</button>
  </div></div>
  <div id="uf-body"><div class="notice">시군구를 고르세요.</div></div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
(function () {
  const body = document.getElementById("uf-body");
  const SPORTS = ["태권도", "수영", "헬스", "축구(풋살)", "복싱", "필라테스", "댄스(줌바 등)", "무용(발레 등)", "줄넘기", "농구", "야구", "검도", "유도", "합기도", "요가", "주짓수", "배드민턴", "탁구", "골프", "기타종목"];
  const sel = document.getElementById("f-sport"); SPORTS.forEach((s) => { const o = document.createElement("option"); o.value = s; o.textContent = s; sel.appendChild(o); });
  async function load() {
    const code = window.currentRegion && window.currentRegion(); if (!code) { showSnackbar("시군구를 고르세요", "error"); return; }
    body.innerHTML = '<div class="empty-state"><span class="spinner"></span></div>';
    try {
      const d = await api.get("/api/user/facilities" + qs({ region: code, sport: sel.value, q: document.getElementById("f-q").value, evening: document.getElementById("f-evening").checked, active_only: document.getElementById("f-active").checked }));
      if (!d.items.length) { body.innerHTML = '<div class="empty-state">조건에 맞는 시설이 없습니다. <a href="/user/voice">동네 목소리</a>에 수요를 남겨 보세요.</div>'; return; }
      body.innerHTML = `<p class="faint">${d.items.length}곳 · 최근 운영 기준 ${esc(d.cutoff)} 이후</p><div class="tile-grid">${d.items.map((f) => `<div class="tile"><div class="t"><a href="#" data-fac="${esc(f.facilityId)}">${esc(f.name)}</a></div><div class="m">${esc((f.activeSports.length ? f.activeSports : f.sports || []).join(", "))}</div><div class="m">${esc(f.address || "")}${f.tel ? " · " + esc(f.tel) : ""}</div><div class="row m">${f.activeCourses ? `<span class="chip">강좌 ${f.activeCourses}</span>` : ""}${f.eveningCourses ? `<span class="chip">저녁 ${f.eveningCourses}</span>` : ""}${f.weekendCourses ? `<span class="chip">주말 ${f.weekendCourses}</span>` : ""}${f.minPrice != null ? `<span class="chip off">월 ${fmtWon(f.minPrice)}부터</span>` : ""}${f.transit ? `<span class="chip off">정류장 ${Math.round(f.transit.minWalkSec / 60)}분</span>` : ""}</div></div>`).join("")}</div>`;
      body.querySelectorAll("[data-fac]").forEach((a) => a.addEventListener("click", async (e) => { e.preventDefault(); show(code, a.dataset.fac); }));
    } catch (e) { body.innerHTML = `<div class="notice error">${esc(e.message)}</div>`; }
  }
  async function show(code, id) {
    try {
      const f = await api.get(`/api/gap/${code}/facility/${id}`);
      const html = `<div class="dialog-backdrop open" id="fac-dialog"><div class="dialog dialog-lg"><div class="dialog-header"><h2>${esc(f.name)}</h2><button class="btn-icon" data-dialog-close>&times;</button></div>
        <p class="small">${esc(f.address || "")} ${esc(f.detailAddress || "")}${f.tel ? " · " + esc(f.tel) : ""}${f.transit ? ` · 정류장 ${esc(f.transit.stopName)} 도보 ${Math.round(f.transit.minWalkSec / 60)}분` : ""}</p>
        <div class="table-wrap"><table class="table responsive"><thead><tr><th>강좌</th><th>시간</th><th class="num">월 수강료</th><th>최근</th></tr></thead><tbody>${f.courses.map((c) => `<tr><td class="name" data-label="강좌">${esc(c.name)}<span class="sub">${esc(c.sport)}</span></td><td data-label="시간">${esc(fmtSessions(c.sessions))}</td><td class="num" data-label="월 수강료">${fmtWon(c.priceWon)}</td><td data-label="최근">${esc(c.lastMonth)} · 신청 ${fmtNum(c.lastApplicants)}</td></tr>`).join("")}</tbody></table></div>
        <p class="faint mt-8">현재 모집 여부·잔여석은 시설에 확인하세요. 신청·결제는 <a href="https://svoucher.kspo.or.kr/main.do" target="_blank" rel="noopener">공식 사이트</a>에서 합니다.</p></div></div>`;
      const old = document.getElementById("fac-dialog"); if (old) old.remove(); document.body.insertAdjacentHTML("beforeend", html);
    } catch (e) { showSnackbar(e.message, "error"); }
  }
  document.getElementById("f-go").addEventListener("click", load);
  document.addEventListener("region-change", load);
  if (window.currentRegion && window.currentRegion()) load();
})();
</script>
{% endblock %}
